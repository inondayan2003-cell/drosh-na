<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דרוש-נא</title>
<meta name="description" content="דרשה מוכנה לשבת, לחג או לאירוע, באורך שאתה בוחר, תוך פחות מדקה.">
<meta name="theme-color" content="#1F295F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B3E" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-primary:#2D5B9A;
    --color-primary-deep:#1F295F;
    --color-gold:#B8913A;
    --color-bg:#F5F6F8;
    --color-parchment:#FBF7EE;
    --color-ink:#1C2230;
    --color-ink-soft:rgba(28,34,48,.62);
    --color-card-bg:#FFFFFF;
    --color-border:rgba(28,34,48,.12);
    --color-danger:#9A3B3B;
    --color-on-primary:#FFFFFF;
    --font-display:'Suez One', 'Frank Ruhl Libre', serif;
    --font-reading:'Frank Ruhl Libre', Georgia, serif;
    --font-ui:'Assistant', -apple-system, BlinkMacSystemFont, sans-serif;
    --shadow-card:0 2px 10px rgba(26,55,97,.08);
    --dur-fast:100ms;
    --dur-base:200ms;
    --dur-slow:500ms;
    --ease-out:ease-out;
    --ease-scroll:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --color-primary:#7EA6DE;
      --color-primary-deep:#141B3E;
      --color-gold:#D6B25E;
      --color-bg:#131822;
      --color-parchment:#1E2230;
      --color-ink:#E7EAF0;
      --color-ink-soft:rgba(231,234,240,.62);
      --color-card-bg:#1A2030;
      --color-border:rgba(231,234,240,.14);
      --shadow-card:0 2px 10px rgba(0,0,0,.35);
      --color-on-primary:#0B1220;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--color-bg);
    color:var(--color-ink);
    font-family:var(--font-ui);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  button, input{font-family:inherit;}
  h1,h2,h3,p{margin:0;}
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  a, button{
    -webkit-tap-highlight-color:transparent;
  }
  button{cursor:pointer;}
  :focus-visible{
    outline:3px solid var(--color-gold);
    outline-offset:2px;
    border-radius:6px;
  }

  /* reduced motion: kill all transitions/animations globally */
  .reduced-motion *{
    animation-duration:0.001ms !important;
    animation-delay:0ms !important;
    transition-duration:0.001ms !important;
  }

  /* ---------- app shell ---------- */
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header#topbar{
    position:relative;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 16px;
    background:var(--color-primary-deep);
    text-align:center;
  }
  #logoBtn{
    background:none; border:none; padding:4px 8px;
    color:#fff; font-family:var(--font-display);
    font-size:26px; letter-spacing:1px;
    display:inline-flex; gap:1px;
  }
  #logoBtn .letter{
    display:inline-block;
    opacity:1;
  }
  #logoBtn.animate-logo .letter{
    opacity:0;
    transform:translateY(6px);
    animation:letterIn 260ms var(--ease-out) forwards;
  }
  @keyframes letterIn{
    to{opacity:1; transform:translateY(0);}
  }
  .thread{
    height:2px;
    margin:10px auto 0;
    width:88%;
    background-image:repeating-linear-gradient(to left, var(--color-gold) 0 8px, transparent 8px 14px);
    transform:scaleX(0);
    transform-origin:right center;
  }
  .thread.animate-thread{
    animation:threadIn 500ms var(--ease-out) forwards;
    animation-delay:900ms;
  }
  .thread.static-thread{transform:scaleX(1);}
  @keyframes threadIn{
    to{transform:scaleX(1);}
  }

  main#screen-root{
    flex:1;
    position:relative;
    overflow-x:hidden;
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  }
  .screen{
    padding:18px 20px 8px;
    animation-duration:var(--dur-base);
    animation-timing-function:var(--ease-out);
    animation-fill-mode:both;
  }
  .screen.enter-forward{animation-name:enterForward;}
  .screen.enter-back{animation-name:enterBack;}
  @keyframes enterForward{
    from{opacity:0; transform:translateX(-18px);}
    to{opacity:1; transform:translateX(0);}
  }
  @keyframes enterBack{
    from{opacity:0; transform:translateX(18px);}
    to{opacity:1; transform:translateX(0);}
  }

  .back-row{
    display:flex; align-items:center; margin-bottom:10px;
  }
  .back-btn{
    background:none; border:none; color:var(--color-primary);
    font-family:var(--font-ui); font-weight:600; font-size:15px;
    display:inline-flex; align-items:center; gap:6px;
    min-height:44px; padding:4px 8px; border-radius:8px;
  }
  .back-btn:active{transform:scale(.98);}
  .back-btn .arrow{font-size:18px;}

  /* ---------- home ---------- */
  .home-intro{text-align:center; margin:18px 0 28px;}
  .home-title{
    font-family:var(--font-display);
    font-size:44px;
    color:var(--color-primary);
  }
  .home-tagline{
    margin-top:10px;
    color:var(--color-ink-soft);
    font-size:15px;
    line-height:1.6;
  }
  .home-cards{display:flex; flex-direction:column; gap:14px;}
  .home-card{
    display:block; width:100%; text-align:right;
    background:var(--color-card-bg);
    border:none;
    border-radius:14px;
    padding:20px 18px;
    box-shadow:var(--shadow-card);
    border-right:5px solid var(--color-primary);
    min-height:44px;
  }
  .home-card:active{transform:scale(.98);}
  .home-card-title{
    font-family:var(--font-display);
    font-size:21px;
    color:var(--color-ink);
  }
  .home-card-desc{
    margin-top:6px;
    font-size:14px;
    color:var(--color-ink-soft);
    line-height:1.5;
  }

  /* ---------- generic screen bits ---------- */
  .screen-title{
    font-family:var(--font-display);
    font-size:24px;
    color:var(--color-ink);
    margin-bottom:4px;
  }
  .screen-sub{
    color:var(--color-ink-soft);
    font-size:14px;
    margin-bottom:18px;
  }
  .notice{
    background:var(--color-card-bg);
    border:1px solid var(--color-border);
    border-right:4px solid var(--color-gold);
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
    color:var(--color-ink);
    line-height:1.6;
    margin-bottom:16px;
  }
  .notice.error{border-right-color:var(--color-danger);}

  /* parasha board */
  .parasha-board{
    background:var(--color-card-bg);
    border:1px solid var(--color-gold);
    border-radius:14px;
    padding:26px 18px;
    text-align:center;
    margin-bottom:16px;
    min-height:96px;
    display:flex; align-items:center; justify-content:center;
  }
  .parasha-board.loading .board-name{
    animation:shimmer 1.1s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%,100%{opacity:.35;}
    50%{opacity:.9;}
  }
  .board-name{
    font-family:var(--font-display);
    font-size:26px;
    color:var(--color-primary);
  }
  .board-name.settle{
    animation:settleIn 300ms ease-in-out;
  }
  @keyframes settleIn{
    from{opacity:0;} to{opacity:1;}
  }
  .primary-btn{
    display:block; width:100%;
    background:var(--color-primary);
    color:var(--color-on-primary); border:none; border-radius:12px;
    font-family:var(--font-ui); font-weight:700; font-size:16px;
    min-height:48px;
    padding:12px 16px;
    margin-bottom:14px;
  }
  .primary-btn:active{transform:scale(.98);}
  .primary-btn[disabled]{opacity:.45; pointer-events:none;}

  .link-btn{
    background:none; border:none; color:var(--color-primary);
    font-weight:600; font-size:14px; text-decoration:underline;
    min-height:44px; padding:4px;
  }

  select.parasha-select{
    width:100%;
    min-height:44px;
    border-radius:10px;
    border:1px solid var(--color-border);
    background:var(--color-card-bg);
    color:var(--color-ink);
    padding:8px 12px;
    font-family:var(--font-ui);
    font-size:15px;
    margin-top:10px;
  }
  option[disabled]{color:var(--color-ink-soft);}

  details.manual-picker{margin-top:6px;}
  details.manual-picker > summary{
    cursor:pointer; color:var(--color-primary); font-weight:600;
    font-size:14px; min-height:44px; display:flex; align-items:center;
    list-style:none;
  }
  details.manual-picker > summary::-webkit-details-marker{display:none;}

  /* search / topics */
  .search-wrap{position:relative; margin-bottom:14px;}
  #topicSearch{
    width:100%; min-height:44px;
    border-radius:10px;
    border:1px solid var(--color-border);
    background:var(--color-card-bg);
    color:var(--color-ink);
    padding:10px 14px;
    font-size:15px;
  }
  .topic-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .topic-row{
    width:100%; text-align:right;
    background:var(--color-card-bg);
    border:1px solid var(--color-border);
    border-radius:10px;
    padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between;
    min-height:44px;
    animation:fadeInList 150ms linear both;
  }
  @keyframes fadeInList{ from{opacity:0;} to{opacity:1;} }
  .topic-row.available{}
  .topic-row .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--color-gold);
    flex-shrink:0;
    margin-left:10px;
  }
  .topic-row.soon{
    color:var(--color-ink-soft);
    pointer-events:none;
  }
  .topic-row.soon .name{color:var(--color-ink-soft);}
  .topic-name-wrap{display:flex; align-items:center; overflow:hidden;}
  .topic-name{font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topic-tag-soon{
    font-size:12px; color:var(--color-ink-soft);
    background:var(--color-bg);
    border-radius:999px; padding:3px 10px;
    flex-shrink:0;
  }
  .empty-state{
    text-align:center; color:var(--color-ink-soft);
    padding:32px 12px; font-size:14px; line-height:1.7;
  }

  /* length screen */
  .length-options{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .length-card{
    background:var(--color-card-bg);
    border:1px solid var(--color-border);
    border-radius:14px;
    padding:18px;
    text-align:right;
    min-height:44px;
  }
  .length-card:not([disabled]):active{transform:scale(.98);}
  .length-card .len-title{
    font-family:var(--font-display);
    font-size:19px;
    color:var(--color-ink);
  }
  .length-card .len-time{
    margin-top:6px; font-size:14px; color:var(--color-primary); font-weight:600;
  }
  .length-card[disabled]{
    opacity:.5;
  }
  .length-card .len-caption{
    margin-top:6px; font-size:12px; color:var(--color-ink-soft);
  }

  /* reading screen */
  .reading-header{margin-bottom:14px;}
  .reading-context{
    font-size:13px; color:var(--color-primary); font-weight:700;
    margin-bottom:4px;
  }
  .reading-title{
    font-family:var(--font-display);
    font-size:23px;
    color:var(--color-ink);
    margin-bottom:6px;
  }
  .reading-meta{font-size:13px; color:var(--color-ink-soft);}

  .reading-toolbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    background:var(--color-bg);
    padding:10px 0;
    margin-bottom:10px;
    border-bottom:1px solid var(--color-border);
  }
  .toolbar-group{display:flex; align-items:center; gap:6px;}
  .icon-btn{
    background:var(--color-card-bg);
    border:1px solid var(--color-border);
    border-radius:10px;
    min-width:44px; min-height:44px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; color:var(--color-ink);
  }
  .icon-btn:active{transform:scale(.98);}
  .icon-btn.text{font-size:13px; font-weight:600; padding:0 12px; min-width:auto;}
  #fontPct{font-size:12px; color:var(--color-ink-soft); min-width:38px; text-align:center;}

  .parchment{
    background:var(--color-parchment);
    border-radius:14px;
    padding:22px 18px 30px;
    box-shadow:var(--shadow-card);
    transform-origin:top center;
    animation:unfurl 500ms var(--ease-scroll) both;
  }
  @keyframes unfurl{
    from{opacity:0; transform:scaleY(.85) translateY(-8px);}
    to{opacity:1; transform:scaleY(1) translateY(0);}
  }
  .drasha-text{
    font-family:var(--font-reading);
    font-size:calc(19px * var(--reading-scale, 1));
    line-height:1.85;
    color:var(--color-ink);
    max-width:33em;
  }
  .drasha-text p{margin:0 0 16px;}
  .drasha-text p:last-child{margin-bottom:0;}
  .drasha-text .opening-word{
    font-weight:700;
    color:var(--color-gold);
    font-size:1.15em;
  }
  .para-sep{
    display:flex; justify-content:center; gap:6px;
    margin:18px 0;
  }
  .para-sep span{
    width:5px; height:5px; border-radius:50%;
    background:var(--color-gold);
    display:inline-block;
  }
  .para-sep span:nth-child(2){transform:translateY(-3px);}
  .drasha-text .pasuk{
    font-size:1.05em;
    border-right:2px solid var(--color-primary);
    padding-right:10px;
    margin-right:2px;
  }

  .toast{
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    right:50%;
    transform:translateX(50%);
    background:var(--color-primary-deep);
    color:#fff;
    padding:10px 20px;
    border-radius:999px;
    font-size:13px;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:opacity var(--dur-base) var(--ease-out);
    max-width:88%;
    text-align:center;
    z-index:20;
  }
  .toast.show{opacity:1;}
  .toast .check{
    color:var(--color-gold); font-weight:900;
  }

  @media (min-width:480px){
    #app{border-inline:1px solid var(--color-border);}
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="logoBtn" type="button" aria-label="דרוש-נא, חזרה למסך הבית"></button>
    <div class="thread" id="thread"></div>
  </header>
  <main id="screen-root" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";

  /* ============ constants ============ */

  var PARASHA_ORDER = [
    "בראשית","נח","לך לך","וירא","חיי שרה","תולדות","ויצא","וישלח","וישב","מקץ","ויגש","ויחי",
    "שמות","וארא","בא","בשלח","יתרו","משפטים","תרומה","תצוה","כי תשא","ויקהל","פקודי",
    "ויקרא","צו","שמיני","תזריע","מצרע","אחרי מות","קדושים","אמור","בהר","בחוקותי",
    "במדבר","נשא","בהעלתך","שלח","קורח","חוקת","בלק","פינחס","מטות","מסעי",
    "דברים","ואתחנן","עקב","ראה","שופטים","כי תצא","כי תבוא","נצבים","וילך","האזינו","וזאת הברכה"
  ];

  /* Maps the exact Hebrew string Hebcal returns (prefix "פרשת " stripped)
     to either a single canonical name, or an array of two canonical names
     for a combined double-portion (in reading order). Hebcal sometimes
     spells a single multi-word parasha name with a maqaf (e.g. "שלח־לך",
     "כי־תצא") which looks like a combo but isn't — those map to a string. */
  var HEBCAL_MAP = {
    "בראשית":"בראשית", "נח":"נח", "לך לך":"לך לך", "לך־לך":"לך לך",
    "וירא":"וירא", "חיי שרה":"חיי שרה", "תולדות":"תולדות", "ויצא":"ויצא",
    "וישלח":"וישלח", "וישב":"וישב", "מקץ":"מקץ", "ויגש":"ויגש", "ויחי":"ויחי",
    "שמות":"שמות", "וארא":"וארא", "בא":"בא", "בשלח":"בשלח", "יתרו":"יתרו",
    "משפטים":"משפטים", "תרומה":"תרומה", "תצוה":"תצוה", "תצווה":"תצוה",
    "כי תשא":"כי תשא",
    "ויקהל":"ויקהל", "פקודי":"פקודי", "ויקהל־פקודי":["ויקהל","פקודי"], "ויקהל-פקודי":["ויקהל","פקודי"],
    "ויקרא":"ויקרא", "צו":"צו", "שמיני":"שמיני",
    "תזריע":"תזריע", "מצרע":"מצרע", "תזריע־מצרע":["תזריע","מצרע"], "תזריע-מצרע":["תזריע","מצרע"],
    "אחרי מות":"אחרי מות", "קדשים":"קדושים", "קדושים":"קדושים",
    "אחרי מות־קדשים":["אחרי מות","קדושים"], "אחרי מות-קדשים":["אחרי מות","קדושים"],
    "אמור":"אמור", "בהר":"בהר", "בחקתי":"בחוקותי", "בחוקותי":"בחוקותי",
    "בהר־בחקתי":["בהר","בחוקותי"], "בהר-בחקתי":["בהר","בחוקותי"],
    "במדבר":"במדבר", "נשא":"נשא", "בהעלתך":"בהעלתך",
    "שלח":"שלח", "שלח לך":"שלח", "שלח־לך":"שלח", "שלח-לך":"שלח",
    "קורח":"קורח", "קרח":"קורח", "חוקת":"חוקת", "חקת":"חוקת",
    "בלק":"בלק", "פינחס":"פינחס",
    "מטות":"מטות", "מסעי":"מסעי", "מטות־מסעי":["מטות","מסעי"], "מטות-מסעי":["מטות","מסעי"],
    "דברים":"דברים", "ואתחנן":"ואתחנן", "עקב":"עקב", "ראה":"ראה", "שופטים":"שופטים",
    "כי תצא":"כי תצא", "כי־תצא":"כי תצא", "כי-תצא":"כי תצא",
    "כי תבוא":"כי תבוא", "כי־תבוא":"כי תבוא", "כי-תבוא":"כי תבוא",
    "נצבים":"נצבים", "וילך":"וילך", "נצבים־וילך":["נצבים","וילך"], "נצבים-וילך":["נצבים","וילך"],
    "האזינו":"האזינו", "וזאת הברכה":"וזאת הברכה"
  };

  var WORDS_PER_MINUTE = 120;

  /* ============ data / state ============ */

  var DATA = (window.DROSH_DATA && window.DROSH_DATA.parashot && window.DROSH_DATA.topics)
    ? window.DROSH_DATA : null;

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) document.documentElement.classList.add('reduced-motion');

  var firstBoot = true;
  var stack = []; // {screen, params}
  var readingScale = 1;

  var root = document.getElementById('screen-root');
  var logoBtn = document.getElementById('logoBtn');
  var thread = document.getElementById('thread');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  /* ============ helpers ============ */

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function wordCount(paragraphs){
    var text = (paragraphs || []).join(' ');
    var m = text.trim().match(/\S+/g);
    return m ? m.length : 0;
  }

  function minutesFor(paragraphs){
    var n = wordCount(paragraphs);
    if (n === 0) return 0;
    return Math.max(1, Math.round(n / WORDS_PER_MINUTE));
  }

  function drashaOf(entry, len){
    if (!entry) return null;
    return entry[len] || null;
  }

  function hasAny(entry){
    return !!(entry && (entry.short || entry.long));
  }

  function toast(msg){
    toastEl.innerHTML = '<span class="check" aria-hidden="true">✓</span><span>' + esc(msg) + '</span>';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  function errorToast(msg){
    toastEl.innerHTML = '<span>' + esc(msg) + '</span>';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  /* renders quoted segments ("...") inside an already-escaped string as
     styled spans, for pesukim styling */
  function renderParagraphHTML(escapedText){
    return escapedText.replace(/&quot;([^&]*?)&quot;/g, function(_, inner){
      return '<span class="pasuk">&quot;' + inner + '&quot;</span>';
    });
  }

  function paragraphsToHTML(paragraphs, opening){
    return paragraphs.map(function(p, i){
      var e = esc(p);
      if (i === 0 && opening){
        var trimmed = e.replace(/^\s+/, '');
        var firstSpace = trimmed.indexOf(' ');
        var firstWord, rest;
        if (firstSpace === -1){ firstWord = trimmed; rest = ''; }
        else { firstWord = trimmed.slice(0, firstSpace); rest = trimmed.slice(firstSpace); }
        return '<p><span class="opening-word">' + firstWord + '</span>' + renderParagraphHTML(rest) + '</p>';
      }
      return '<p>' + renderParagraphHTML(e) + '</p>';
    }).join('<div class="para-sep" aria-hidden="true"><span></span><span></span><span></span></div>');
  }

  /* ============ navigation ============ */

  function navigate(screen, params, direction){
    if (direction !== 'back'){
      stack.push({screen: screen, params: params});
    }
    render(screen, params, direction || 'forward');
  }

  function goBack(){
    if (stack.length <= 1){
      stack = [{screen:'home'}];
      render('home', {}, 'back');
      return;
    }
    stack.pop();
    var top = stack[stack.length - 1];
    render(top.screen, top.params, 'back');
  }

  function goHome(){
    stack = [{screen:'home'}];
    render('home', {}, 'back');
  }

  logoBtn.addEventListener('click', goHome);

  /* ============ renderers ============ */

  var RENDERERS = {
    home: renderHome,
    parasha: renderParasha,
    general: renderGeneral,
    length: renderLength,
    reading: renderReading
  };

  function render(screen, params, direction){
    params = params || {};
    if (!DATA){
      root.innerHTML = renderMissingData();
      return;
    }
    var html = RENDERERS[screen](params);
    root.innerHTML = html;
    root.querySelector('.screen').classList.add(direction === 'back' ? 'enter-back' : 'enter-forward');
    wireScreen(screen, params);
    window.scrollTo(0,0);
  }

  function renderMissingData(){
    return '' +
      '<div class="screen">' +
      '<div class="home-intro"><div class="home-title">דרוש-נא</div></div>' +
      '<div class="notice error">המאגר לא נטען. רענן את הדף.</div>' +
      '</div>';
  }

  function backRow(label){
    return '<div class="back-row"><button type="button" class="back-btn" data-action="back">' +
      '<span class="arrow" aria-hidden="true">←</span><span>' + esc(label || 'חזרה') + '</span>' +
      '</button></div>';
  }

  function renderHome(){
    return '' +
      '<div class="screen">' +
      '<div class="home-intro">' +
        '<h1 class="visually-hidden">דרוש-נא</h1>' +
        '<p class="home-tagline">דרשה מוכנה לשבת, לחג או לאירוע &mdash; באורך שאתה בוחר, תוך פחות מדקה.</p>' +
      '</div>' +
      '<div class="home-cards">' +
        '<button type="button" class="home-card" data-action="go-parasha">' +
          '<div class="home-card-title">פרשת שבוע</div>' +
          '<div class="home-card-desc">דרשה על פרשת השבוע הקרובה, מזוהה אוטומטית</div>' +
        '</button>' +
        '<button type="button" class="home-card" data-action="go-general">' +
          '<div class="home-card-title">דרשה כללית</div>' +
          '<div class="home-card-desc">דרשה לפי נושא &ndash; שמחה, אבל, חג, אירוע ועוד</div>' +
        '</button>' +
      '</div>' +
      '</div>';
  }

  function buildManualParashaOptions(selected){
    return PARASHA_ORDER.map(function(name){
      var available = hasAny(DATA.parashot[name]);
      var sel = name === selected ? ' selected' : '';
      var dis = available ? '' : ' disabled';
      var label = name + (available ? '' : ' (בקרוב)');
      return '<option value="' + esc(name) + '"' + sel + dis + '>' + esc(label) + '</option>';
    }).join('');
  }

  function renderParasha(params){
    var state = params.loading ? 'loading' : (params.error ? 'error' : 'ready');
    var boardName = params.detected || 'מאתר את הפרשה&hellip;';
    var body = '';

    if (params.holidayNotice){
      body += '<div class="notice">' + esc(params.holidayNotice) + '</div>';
    }
    if (params.error){
      body += '<div class="notice error">לא הצלחנו לאתר את פרשת השבוע אוטומטית. בחר פרשה מהרשימה.</div>';
    }

    body += '<div class="parasha-board' + (state === 'loading' ? ' loading' : '') + '">' +
      '<div class="board-name' + (state === 'ready' ? ' settle' : '') + '">' +
      (state === 'loading' ? 'מאתר את הפרשה&hellip;' : esc('פרשת ' + boardName)) +
      '</div></div>';

    if (state === 'ready' && params.detected){
      body += '<button type="button" class="primary-btn" data-action="confirm-parasha" data-name="' + esc(params.detected) + '">המשך לבחירת אורך</button>';
    }

    body += '<details class="manual-picker"' + (state === 'error' ? ' open' : '') + '>' +
      '<summary>בחר פרשה אחרת מהרשימה</summary>' +
      '<select class="parasha-select" id="manualParashaSelect" aria-label="בחירת פרשה">' +
      '<option value="">&ndash; בחר פרשה &ndash;</option>' +
      buildManualParashaOptions(params.detected) +
      '</select>' +
      '</details>';

    return '<div class="screen">' +
      backRow() +
      '<h1 class="screen-title">פרשת שבוע</h1>' +
      body +
      '</div>';
  }

  function renderGeneral(params){
    var query = params.query || '';
    var topics = DATA.topics.slice();
    var q = query.trim();

    var filtered = topics.filter(function(t){
      if (!q) return true;
      var hay = t.name + ' ' + (t.tags || []).join(' ');
      return hay.indexOf(q) !== -1;
    });

    filtered.sort(function(a, b){
      var av = hasAny(a) ? 0 : 1;
      var bv = hasAny(b) ? 0 : 1;
      return av - bv;
    });

    var listHTML;
    if (filtered.length === 0){
      listHTML = '<div class="empty-state">אין נושא בשם &laquo;' + esc(query) + '&raquo; עדיין. נסה מילה אחרת.</div>';
    } else {
      listHTML = '<ul class="topic-list">' + filtered.map(function(t){
        var avail = hasAny(t);
        var cls = 'topic-row' + (avail ? ' available' : ' soon');
        var action = avail ? ' data-action="go-length" data-type="topic" data-name="' + esc(t.name) + '"' : '';
        return '<li>' +
          '<button type="button" class="' + cls + '"' + action + (avail ? '' : ' disabled aria-disabled="true"') + '>' +
            '<span class="topic-name-wrap">' + (avail ? '<span class="dot" aria-hidden="true"></span>' : '') + '<span class="name topic-name">' + esc(t.name) + '</span></span>' +
            (avail ? '' : '<span class="topic-tag-soon">בקרוב</span>') +
          '</button>' +
        '</li>';
      }).join('') + '</ul>';
    }

    return '<div class="screen">' +
      backRow() +
      '<h1 class="screen-title">דרשה כללית</h1>' +
      '<div class="search-wrap">' +
        '<input type="search" id="topicSearch" placeholder="חפש נושא&hellip; (למשל: חתונה, אבל, חג)" value="' + esc(query) + '" aria-label="חיפוש נושא">' +
      '</div>' +
      listHTML +
      '</div>';
  }

  function renderLength(params){
    var type = params.type;
    var name = params.name;
    var entry = type === 'parasha' ? DATA.parashot[name] : DATA.topics.filter(function(t){ return t.name === name; })[0];
    var title = type === 'parasha' ? 'פרשת ' + name : name;

    var shortDrasha = entry ? entry.short : null;
    var longDrasha = entry ? entry.long : null;
    var shortMin = shortDrasha ? minutesFor(shortDrasha.text) : 0;
    var longMin = longDrasha ? minutesFor(longDrasha.text) : 0;

    function optionButton(len, drasha, minutes, labelName, hint){
      var avail = !!drasha;
      var attrs = avail
        ? ' data-action="go-reading" data-type="' + esc(type) + '" data-name="' + esc(name) + '" data-len="' + len + '"'
        : ' disabled aria-disabled="true"';
      return '<button type="button" class="length-card"' + attrs + '>' +
        '<div class="len-title">' + esc(labelName) + '</div>' +
        (avail ? '<div class="len-time">כ-' + minutes + ' דקות דיבור</div>' : '<div class="len-caption">' + esc(hint) + '</div>') +
        '</button>';
    }

    var body = '<div class="length-options">' +
      optionButton('short', shortDrasha, shortMin, 'קצרה', 'הדרשה הזאת עוד לא נוספה למאגר') +
      optionButton('long', longDrasha, longMin, 'ארוכה', 'הדרשה הזאת עוד לא נוספה למאגר') +
      '</div>';

    if (!shortDrasha && !longDrasha){
      body += '<div class="notice" style="margin-top:16px;">הדרשה הזאת עוד לא נוספה למאגר. בקרוב!</div>';
    }

    return '<div class="screen">' +
      backRow() +
      '<h1 class="screen-title">' + esc(title) + '</h1>' +
      '<p class="screen-sub">בחר אורך דרשה</p>' +
      body +
      '</div>';
  }

  function renderReading(params){
    var type = params.type;
    var name = params.name;
    var len = params.len;
    var entry = type === 'parasha' ? DATA.parashot[name] : DATA.topics.filter(function(t){ return t.name === name; })[0];
    var drasha = entry ? entry[len] : null;

    if (!drasha){
      return '<div class="screen">' + backRow() + '<div class="notice error">הדרשה הזאת לא נמצאה.</div></div>';
    }

    var context = type === 'parasha' ? 'פרשת ' + name : name;
    var minutes = minutesFor(drasha.text);
    var words = wordCount(drasha.text);
    var canShare = !!(navigator.share);

    return '<div class="screen">' +
      backRow('חזרה לבחירת אורך') +
      '<div class="reading-header">' +
        '<div class="reading-context">' + esc(context) + ' &middot; ' + (len === 'short' ? 'קצרה' : 'ארוכה') + '</div>' +
        '<h1 class="reading-title">' + esc(drasha.title) + '</h1>' +
        '<div class="reading-meta">כ-' + minutes + ' דקות דיבור &middot; ' + words + ' מילים</div>' +
      '</div>' +
      '<div class="reading-toolbar">' +
        '<div class="toolbar-group" role="group" aria-label="גודל טקסט">' +
          '<button type="button" class="icon-btn" data-action="font-dec" aria-label="הקטן טקסט">א-</button>' +
          '<span id="fontPct">' + Math.round(readingScale * 100) + '%</span>' +
          '<button type="button" class="icon-btn" data-action="font-inc" aria-label="הגדל טקסט">א+</button>' +
        '</div>' +
        '<div class="toolbar-group">' +
          '<button type="button" class="icon-btn text" data-action="copy-drasha">העתק דרשה</button>' +
          (canShare ? '<button type="button" class="icon-btn text" data-action="share-drasha">שתף</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="parchment">' +
        '<div class="drasha-text" id="drashaText" style="--reading-scale:' + readingScale + '">' +
          paragraphsToHTML(drasha.text, true) +
        '</div>' +
      '</div>' +
      '</div>';
  }

  /* ============ wiring per screen ============ */

  function wireScreen(screen, params){
    var el = root;

    var backBtn = el.querySelector('[data-action="back"]');
    if (backBtn) backBtn.addEventListener('click', goBack);

    if (screen === 'home'){
      el.querySelector('[data-action="go-parasha"]').addEventListener('click', function(){
        navigate('parasha', {loading:true});
        detectParasha();
      });
      el.querySelector('[data-action="go-general"]').addEventListener('click', function(){
        navigate('general', {query:''});
      });
      if (firstBoot){
        playOpeningAnimation();
        firstBoot = false;
      } else {
        logoBtn.textContent = 'דרוש-נא';
        thread.classList.add('static-thread');
      }
    }

    if (screen === 'parasha'){
      var confirmBtn = el.querySelector('[data-action="confirm-parasha"]');
      if (confirmBtn){
        confirmBtn.addEventListener('click', function(){
          navigate('length', {type:'parasha', name: confirmBtn.getAttribute('data-name')});
        });
      }
      var select = el.querySelector('#manualParashaSelect');
      if (select){
        select.addEventListener('change', function(){
          if (select.value) navigate('length', {type:'parasha', name: select.value});
        });
      }
    }

    if (screen === 'general'){
      var input = el.querySelector('#topicSearch');
      input.addEventListener('input', function(){
        render('general', {query: input.value}, 'forward-silent');
        var live = root.querySelector('#topicSearch');
        live.focus();
        live.setSelectionRange(live.value.length, live.value.length);
      });
      el.querySelectorAll('[data-action="go-length"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          navigate('length', {type: btn.getAttribute('data-type'), name: btn.getAttribute('data-name')});
        });
      });
    }

    if (screen === 'length'){
      el.querySelectorAll('[data-action="go-reading"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          readingScale = 1;
          navigate('reading', {
            type: btn.getAttribute('data-type'),
            name: btn.getAttribute('data-name'),
            len: btn.getAttribute('data-len')
          });
        });
      });
    }

    if (screen === 'reading'){
      var decBtn = el.querySelector('[data-action="font-dec"]');
      var incBtn = el.querySelector('[data-action="font-inc"]');
      var pctEl = el.querySelector('#fontPct');
      var textEl = el.querySelector('#drashaText');

      function applyScale(){
        readingScale = Math.max(0.8, Math.min(1.8, readingScale));
        textEl.style.setProperty('--reading-scale', readingScale);
        pctEl.textContent = Math.round(readingScale * 100) + '%';
      }
      decBtn.addEventListener('click', function(){ readingScale -= 0.1; applyScale(); });
      incBtn.addEventListener('click', function(){ readingScale += 0.1; applyScale(); });

      el.querySelector('[data-action="copy-drasha"]').addEventListener('click', function(){
        var entry = params.type === 'parasha' ? DATA.parashot[params.name] : DATA.topics.filter(function(t){ return t.name === params.name; })[0];
        var drasha = entry[params.len];
        var plain = drasha.title + '\n\n' + drasha.text.join('\n\n');
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(plain).then(function(){
            toast('הדרשה הועתקה');
          }).catch(function(){
            errorToast('ההעתקה לא עבדה. סמן את הטקסט והעתק ידנית.');
          });
        } else {
          errorToast('ההעתקה לא עבדה. סמן את הטקסט והעתק ידנית.');
        }
      });

      var shareBtn = el.querySelector('[data-action="share-drasha"]');
      if (shareBtn){
        shareBtn.addEventListener('click', function(){
          var entry = params.type === 'parasha' ? DATA.parashot[params.name] : DATA.topics.filter(function(t){ return t.name === params.name; })[0];
          var drasha = entry[params.len];
          navigator.share({
            title: drasha.title,
            text: drasha.title + '\n\n' + drasha.text.join('\n\n')
          }).catch(function(){ /* user cancelled share — no action needed */ });
        });
      }
    }
  }

  function playOpeningAnimation(){
    var text = 'דרוש-נא';
    var chars = text.split('');
    logoBtn.innerHTML = chars.map(function(ch, i){
      var delay = (i * 90) + 'ms';
      return '<span class="letter" style="animation-delay:' + delay + '">' + esc(ch) + '</span>';
    }).join('');
    logoBtn.classList.add('animate-logo');
    thread.classList.add('animate-thread');
  }

  /* ============ parasha detection ============ */

  function todayISO(d){
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function nextSaturdayISO(from){
    var d = new Date(from.getTime());
    var day = d.getDay(); // 0=Sun ... 6=Sat
    var diff = (6 - day + 7) % 7;
    d.setDate(d.getDate() + diff);
    return todayISO(d);
  }

  function resolveHebrewName(rawHebrew){
    var stripped = rawHebrew.replace(/^פרשת\s+/, '').trim();
    var mapped = HEBCAL_MAP[stripped];
    if (!mapped){
      // fall back: normalize maqaf to space and hope for the best
      var normalized = stripped.replace(/־/g, ' ');
      mapped = HEBCAL_MAP[normalized] || normalized;
    }
    return mapped;
  }

  function pickFromMapped(mapped){
    if (Array.isArray(mapped)){
      for (var i = 0; i < mapped.length; i++){
        if (hasAny(DATA.parashot[mapped[i]])) return mapped[i];
      }
      return mapped[0];
    }
    return mapped;
  }

  function detectParasha(){
    var today = new Date();
    var start = todayISO(today);
    var end = new Date(today.getTime());
    end.setDate(end.getDate() + 35);
    var endStr = todayISO(end);

    var url = 'https://www.hebcal.com/hebcal?v=1&cfg=json&s=on&i=on&maj=off&min=off&mod=off&nx=off&mf=off&ss=off&c=off&geo=none'
      + '&start=' + start + '&end=' + endStr;

    fetch(url).then(function(res){
      if (!res.ok) throw new Error('bad response');
      return res.json();
    }).then(function(json){
      var items = (json.items || []).filter(function(it){ return it.category === 'parashat'; });
      items.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
      if (items.length === 0) throw new Error('no parashat items');

      var first = items[0];
      var mapped = resolveHebrewName(first.hebrew);
      var resolved = pickFromMapped(mapped);

      var expectedSaturday = nextSaturdayISO(today);
      var holidayNotice = null;
      if (first.date !== expectedSaturday){
        holidayNotice = 'השבת הקרובה חלה בחג. הפרשה הבאה: פרשת ' + resolved;
      }

      navigate('parasha', {detected: resolved, holidayNotice: holidayNotice}, 'back');
    }).catch(function(){
      navigate('parasha', {error:true}, 'back');
    });
  }

  /* ============ boot ============ */

  stack = [{screen:'home', params:{}}];
  render('home', {}, 'forward');
})();
</script>
</body>
